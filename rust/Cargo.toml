[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "CPL-1.0"

[workspace.lints.rust]
# `forbid` here is deliberate and is specified by `2026-07-27-rust-rewrite.md:23`:
# the choice of `forbid` versus `deny` at a crate root **is** the record of
# whether that crate has been granted an unsafe exception, and `:32` makes the
# list of roots carrying `deny` a reportable item at every phase exit.
#
# `unsafe` is discouraged rather than banned (`CLAUDE.md` carries the bar a site
# must clear). An approved site does not relax this line: that one crate drops
# `lints.workspace = true`, carries its own `#![deny(unsafe_code)]` at its root
# and `#[allow(unsafe_code)]` on the single module. Relaxing this line instead
# would put every crate into the state reserved for a granted exception, which
# is what happened briefly on 2026-08-11 and was reverted.
unsafe_code = "forbid"

# Pinned rather than left to cargo's defaults, because both of this profile's
# consumers are measurements and a default that moves is a measurement that
# moves with it.
[profile.release]
# `debug` does not change codegen; it adds the symbols and line tables a
# sampling profiler needs. Carried by the release profile itself, so the binary
# being profiled is the binary being measured rather than a near neighbour of
# it.
debug = true
# `lto` and `codegen-units` do change codegen. They are set here, before the
# phase's baseline is taken, so that whatever they are worth is inside the
# baseline instead of available later as an interpreter improvement that never
# touched the interpreter.
lto = "fat"
codegen-units = 1
