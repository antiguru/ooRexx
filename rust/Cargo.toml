[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "CPL-1.0"

[workspace.lints.rust]
# `deny` and not `forbid`, decided by Moritz 2026-08-20 after the alternative
# was built and found unbuildable.
#
# `unsafe` is discouraged rather than banned (`CLAUDE.md` carries the bar a site
# must clear). `2026-07-27-rust-rewrite.md:23` had the record of a granted
# exception be `forbid` versus `deny` at a crate root, with the granted crate
# dropping `lints.workspace = true`. **Cargo does not allow that**: it refuses
# `lints.workspace = true` beside any local override -- "cannot override
# `workspace.lints` in `lints`, either remove the overrides or
# `lints.workspace = true` and manually specify the lints" -- so the granted
# crate would have to copy this whole table, and the clippy block below is
# around a hundred lines that would then drift.
#
# `forbid` also cannot be overridden by an inner `#[allow]`, which is what an
# approved *module* needs; `deny` can. So the level moves here and the record
# moves with it: **the record of every granted site is now the set of
# `#[allow(unsafe_code)]` attributes in the tree**, which names the module
# rather than the crate and is asserted rather than described --
# `crates/rexx-core/tests/unsafe_sites.rs` fails if that set changes, and is
# the reportable item `:32` asks for.
unsafe_code = "deny"

# Adopted from `TimelyDataflow/timely-dataflow`'s `Cargo.toml`, fetched
# 2026-08-15. Levels follow that file except where a line below says otherwise.
[workspace.lints.clippy]
type_complexity = "allow"
option_map_unit_fn = "allow"
wrong_self_convention = "allow"
should_implement_trait = "allow"
module_inception = "allow"

# Upstream carries this line commented out. Set explicitly here so the decision
# is recorded rather than inherited by omission.
#
# Measured 2026-08-15 with this line set to `warn`, by `cargo clippy --workspace
# --all-targets --message-format=json`, counted by `message.code.code`: 574
# warnings over 299 distinct source spans. Set the line back to `warn` before
# reproducing it; run against the tree as it stands, that command answers zero,
# which is the `allow` working and not the number having rotted.
#
# Each span is a truncation-and-sign judgement inside a numeric interpreter
# whose bar is byte-for-byte agreement with the C++ oracle, so a wrong rewrite
# is a silent behavioural change and not a build failure.
# What would close this: a checked cast helper in the shape of Materialize's
# `CastFrom`/`CastLossy`, which this tree does not have.
as_conversions = "allow"
bool_comparison = "warn"
borrow_interior_mutable_const = "warn"
borrowed_box = "warn"
builtin_type_shadow = "warn"
clone_on_ref_ptr = "warn"
crosspointer_transmute = "warn"
dbg_macro = "warn"
deref_addrof = "warn"
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
double_must_use = "warn"
double_parens = "warn"
duplicate_underscore_argument = "warn"
excessive_precision = "warn"
extra_unused_lifetimes = "warn"
from_over_into = "warn"
match_overlapping_arm = "warn"
must_use_unit = "warn"
mut_mutex_lock = "warn"
needless_borrow = "warn"
needless_pass_by_ref_mut = "warn"
needless_question_mark = "warn"
needless_return = "warn"
no_effect = "warn"
panicking_overflow_checks = "warn"
partialeq_ne_impl = "warn"
print_literal = "warn"
redundant_closure = "warn"
redundant_closure_call = "warn"
redundant_field_names = "warn"
redundant_pattern = "warn"
redundant_slicing = "warn"
redundant_static_lifetimes = "warn"
same_item_push = "warn"
# Upstream sets this to `warn`.
#
# Measured 2026-08-15 the same way, with this line set to `warn`: 380 warnings
# over 314 distinct source spans, in files then under active differential work.
# As of that date, clearing them meant a rename pass over exactly the code whose
# output was being compared byte for byte against the oracle: churn in the diffs
# that mattered most, and nothing else.
shadow_unrelated = "allow"
single_component_path_imports = "warn"
suspicious_assignment_formatting = "warn"
suspicious_else_formatting = "warn"
suspicious_unary_op_formatting = "warn"
todo = "warn"
transmutes_expressible_as_ptr_casts = "warn"
unnecessary_cast = "warn"
unnecessary_lazy_evaluations = "warn"
unnecessary_mut_passed = "warn"
unnecessary_unwrap = "warn"
unused_async = "warn"
useless_asref = "warn"
useless_conversion = "warn"
useless_format = "warn"
wildcard_in_or_patterns = "warn"
write_literal = "warn"
zero_divided_by_zero = "warn"
zero_prefixed_literal = "warn"

# Pinned rather than left to cargo's defaults, because both of this profile's
# consumers are measurements and a default that moves is a measurement that
# moves with it.
[profile.release]
# `debug` does not change codegen; it adds the symbols and line tables a
# sampling profiler needs. Carried by the release profile itself, so the binary
# being profiled is the binary being measured rather than a near neighbour of
# it.
debug = true
# `lto` and `codegen-units` do change codegen. They are set here, before the
# phase's baseline is taken, so that whatever they are worth is inside the
# baseline instead of available later as an interpreter improvement that never
# touched the interpreter.
lto = "fat"
codegen-units = 1

# The debug-assertion gate (`REXX_CORPUS_GATE=1 memcap 8G cargo test --workspace`)
# exists for the `debug_assert`s the release profile compiles out; optimised, it
# keeps `debug-assertions` and `overflow-checks` from `dev`. Measured: 957 s of
# run time unoptimised against 246 s under release. Moritz, 2026-09-05.
[profile.test]
opt-level = 3

# Mutation runs build here rather than in `release`: thin LTO relinks faster,
# and a separate target directory means a mutant binary never overwrites the
# one the witnesses run on. Moritz, 2026-09-05.
[profile.mutation]
inherits = "release"
lto = "thin"
