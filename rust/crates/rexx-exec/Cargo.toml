[package]
name = "rexx-exec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The heap, the root set and the value bodies every evaluated value lives in.
rexx-core = { path = "../rexx-core" }

# The AST this crate executes, and `parse_interpret` for a fragment built at
# run time.
rexx-parse = { path = "../rexx-parse" }

# `Number`, `Form` and the decimal arithmetic a value's own rendering rule
# (D15) runs through: `Body::Text` holds a `Number`, and `format_form` is
# what turns one into text.
rexx-num = { path = "../rexx-num" }

# The message catalogue. Phase 0 already generates `errors.rs` from
# `interpreter/messages/rexxmsg.xml`, 704 messages, and criterion 1 compares
# stderr byte for byte -- so the text an error prints is looked up here rather
# than hand-transcribed. Leaving this crate out of the dependency list is the
# omission spec revision 4 was made to correct.
rexx-inventory = { path = "../rexx-inventory" }

# The class/method-dictionary model (Phase 5a, R9): `ClassRegistry` and
# `ClassGraph`, what `::CLASS`/`::METHOD`/`::ATTRIBUTE` install a class and
# its dictionaries into. This crate does not build a second representation
# of the same thing.
rexx-classes = { path = "../rexx-classes" }

# The interpreter's own `.orx` library sources, embedded with a sha256 pin.
# `Interp::bootstrap_library` runs them at interpreter start;
# `tests/bootstrap_install_oracle.rs` reads the same bytes to compose its own
# differential.
rexx-lib = { path = "../rexx-lib" }

[dev-dependencies]
# Case tables as data files rather than `const` arrays in Rust sources, for
# tables written from Task 6 onward (the plan's Tech Stack section). Test-only,
# and the only dependency this workspace takes from outside it.
# `default-features = false` drops its `async` feature, which is the whole of
# what pulls `futures` in: nothing here runs a case asynchronously.
datadriven = { version = "0.9.0", default-features = false }

# `extract_assertions`, the row extractor `tests/assertions.rs` runs against
# `ootest/ooRexx/base/expressions/`. Test-only: nothing in `src/` produces or
# consumes an `AssertionRow`.
rexx-extract = { path = "../rexx-extract" }


[lints]
workspace = true
