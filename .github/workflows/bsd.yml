name: BSD

# Same scoping as the other workflows: CI branches only, never master.
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

# GitHub has no BSD runners, so these jobs boot a VM on a Linux runner. That
# turned out to be cheap: a full FreeBSD build is 358 ninja steps in 81 seconds,
# VM boot included, so the jobs run the whole test suite rather than only
# building.
#
# The two jobs are near duplicates because they cannot be collapsed. A matrix
# cannot select the `uses:` of an action, and GitHub Actions does not support
# YAML anchors. What they have in common is in .github/ci-bsd.sh instead.
jobs:
  freebsd:
    name: FreeBSD 14.2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          prepare: |
            pkg install -y cmake ninja subversion gdb
          run: |
            sh .github/ci-bsd.sh

      - name: Check test results
        if: always()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/check-test-results.ps1" `
              -ResultsFile "$env:GITHUB_WORKSPACE/testresults.txt" `
              -KnownFailuresFile @(
                  "$env:GITHUB_WORKSPACE/.github/known-test-failures/common.txt",
                  "$env:GITHUB_WORKSPACE/.github/known-test-failures/freebsd.txt") `
              -ExitCodeFile "$env:GITHUB_WORKSPACE/testexitcode.txt" `
              -Platform "FreeBSD 14.2"
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oorexx-testresults-freebsd
          path: testresults.txt
          if-no-files-found: warn

  openbsd:
    name: OpenBSD 7.8
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # OpenBSD is here alongside FreeBSD deliberately. master currently carries a
    # revert made to find out whether a fix caused crashes on Arch, Manjaro and
    # OpenBSD 7, and CI that never runs there cannot help answer that.
    #
    # The release has to stay recent. OpenBSD only keeps packages for the newest
    # couple of releases, so an older image boots but then has nothing to
    # pkg_add: 7.6 failed here with cmake simply not found. The image builder
    # currently offers 7.7 and 7.8.
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          usesh: true
          prepare: |
            pkg_add -I cmake ninja subversion gdb
          run: |
            sh .github/ci-bsd.sh

      - name: Check test results
        if: always()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/.github/check-test-results.ps1" `
              -ResultsFile "$env:GITHUB_WORKSPACE/testresults.txt" `
              -KnownFailuresFile @(
                  "$env:GITHUB_WORKSPACE/.github/known-test-failures/common.txt",
                  "$env:GITHUB_WORKSPACE/.github/known-test-failures/openbsd.txt") `
              -ExitCodeFile "$env:GITHUB_WORKSPACE/testexitcode.txt" `
              -Platform "OpenBSD 7.8"
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oorexx-testresults-openbsd
          path: testresults.txt
          if-no-files-found: warn
