name: Windows

# Deliberately scoped away from master. This workflow only runs for pushes to
# CI branches, so merging it to master would still not start builds there
# without an explicit change to this list.
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    # Pinned rather than windows-latest: "latest" moves between images and would
    # turn an unrelated push into a toolchain change.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Report toolchain
        shell: cmd
        # `where` exits non-zero when it finds nothing, and cmd steps fail on the
        # exit code of the last line, so every probe swallows its own failure.
        run: |
          cmake --version || ver > nul
          cl 2>&1 | findstr /C:"Version" || ver > nul
          where nmake || echo no nmake
          where ninja || echo no ninja
          ver

      - name: Configure
        shell: cmd
        run: >
          cmake -S . -B build -G "NMake Makefiles"
          -DCMAKE_BUILD_TYPE=%BUILD_TYPE%
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Smoke test
        shell: cmd
        run: |
          build\bin\rexx.exe -v
          echo say .rexxinfo~version > hello.rex
          build\bin\rexx.exe hello.rex

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oorexx-windows-x64
          path: |
            build/bin/
            build/lib/
          if-no-files-found: warn

      # The test suite is not part of this repository. It lives in a separate
      # SourceForge SVN repository and its version has to match the interpreter,
      # so trunk tests go with trunk sources.
      - name: Ensure an svn client is present
        shell: pwsh
        run: |
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            Write-Host "no svn on PATH, installing SlikSVN"
            choco install -y svn --no-progress
            "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            svn --version --quiet
          }

      - name: Check out the test suite
        shell: cmd
        run: >
          svn checkout --non-interactive --trust-server-cert
          https://svn.code.sf.net/p/oorexx/code-0/test/trunk ootest

      # The interpreter crashed partway through the suite on the first run, so
      # the run is set up to capture why rather than just report that it did.
      # Local dumps are collected by Windows itself, which also catches the
      # child interpreters the suite spawns.
      - name: Enable crash dumps
        shell: cmd
        run: |
          mkdir C:\dumps
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d C:\dumps /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 10 /f

      - name: Run the test suite
        shell: cmd
        # setTestEnv.bat only prepends the suite root and its framework directory
        # to PATH, so it is inlined here rather than called, which keeps the
        # build tree ahead of any interpreter that might be on the image.
        #
        # The suite's exit code is recorded rather than acted on here. Judging
        # the run is left to the check step, which can tell an environmental
        # failure apart from a real one.
        run: |
          set PATH=%GITHUB_WORKSPACE%\build\bin;%GITHUB_WORKSPACE%\ootest;%GITHUB_WORKSPACE%\ootest\framework;%PATH%
          cd ootest
          rexx.exe testOORexx.rex -s > "%GITHUB_WORKSPACE%\testresults.txt" 2>&1
          echo %ERRORLEVEL% > "%GITHUB_WORKSPACE%\testexitcode.txt"
          type "%GITHUB_WORKSPACE%\testresults.txt"
          exit /b 0

      - name: Check test results
        if: always()
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.github\check-test-results.ps1" `
              -ResultsFile "$env:GITHUB_WORKSPACE\testresults.txt" `
              -KnownFailuresFile @(
                  "$env:GITHUB_WORKSPACE\.github\known-test-failures\common.txt",
                  "$env:GITHUB_WORKSPACE\.github\known-test-failures\windows.txt") `
              -ExitCodeFile "$env:GITHUB_WORKSPACE\testexitcode.txt"
          exit $LASTEXITCODE

      - name: Analyse crash dumps
        if: always()
        shell: cmd
        run: |
          dir C:\dumps
          set CDB=C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe
          if not exist "%CDB%" echo cdb not found at "%CDB%"
          for %%f in (C:\dumps\*.dmp) do (
            echo ================ %%f
            "%CDB%" -z "%%f" -c ".lines;!analyze -v;~*kv;q"
          )
          exit /b 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oorexx-windows-testresults
          path: testresults.txt
          if-no-files-found: warn

      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oorexx-windows-dumps
          path: C:\dumps
          if-no-files-found: ignore
